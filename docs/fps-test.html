<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>TAG CITY — fps-test harness</title>
<!--
FPS TEST HARNESS — not shipped to players. Loads the production game.js in
autotest mode (scripted play, no human input) so a headless browser can
measure real frame times. Results are PROXY numbers (SwiftShader CPU raster
on a VM), never device performance — the iPhone on-device 60fps pass
remains the hard release gate (PRODUCTION-RULES.md #9).
Usage: serve game/ over http, then open
  fps-test.html?autotest=1            — scripted run, ~20s
  fps-test.html?autotest=1&stress=1   — scripted run + reward-VFX spam at the
                                        150-sprite ceiling + lock-on vignette
The page logs FPS_SAMPLE lines to the console and one AUTOTEST_SUMMARY line
at the end; window.__TC__.summary() is the machine-readable hook.
§9 traceability: PRODUCTION-RULES.md #9 (proxy FPS discipline); src/game.js
fps instrumentation (frame ledger, worst-frame + JS-side timing).
-->
<link rel="stylesheet" href="styles.css">
<style>
  html, body { background: #000; }
  #stage { width: 540px; height: 960px; }
</style>
</head>
<body>
<div id="stage" aria-label="TAG CITY fps-test stage"></div>
<div id="hud" aria-label="HUD"></div>
<script src="game.js"></script>
</body>
</html>
